<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GHOS~RD Editor</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050507">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GHOS~RD">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>

    <!-- CO-PILOT PANEL -->
    <div id="copilotPanel" class="copilot-panel">
        <div class="copilot-header">
            <span class="copilot-title">⚡ CO-PILOT AI</span>
            <button id="closeCopilot" class="cyber-btn danger">✕</button>
        </div>

        <div class="copilot-setup">
            <select id="aiProvider" class="copilot-select">
                <option value="">— Pilih AI —</option>
                <option value="openai">ChatGPT (OpenAI)</option>
                <option value="claude">Claude (Anthropic)</option>
                <option value="gemini">Gemini (Google)</option>
                <option value="mistral">Mistral AI</option>
                <option value="groq">Groq (LLaMA)</option>
            </select>

            <div class="api-key-row">
                <input type="password" id="apiKeyInput" class="copilot-input" placeholder="Masukkan API Key...">
                <button id="toggleKey" class="cyber-btn glass-btn">👁</button>
            </div>
            <button id="saveApiKey" class="cyber-btn info" style="width:100%">Simpan Key</button>
        </div>

        <div class="copilot-chat" id="copilotChat">
            <div class="chat-bubble system">Pilih AI dan masukkan API Key untuk mulai.</div>
        </div>

        <div class="copilot-input-row">
            <textarea id="copilotPrompt" class="copilot-textarea" placeholder="Tanya AI atau minta bantu perbaiki code..."></textarea>
            <div class="copilot-actions">
                <button id="analyzeBtn" class="cyber-btn run">📋 Analisis Code</button>
                <button id="sendCopilot" class="cyber-btn info">▶ Kirim</button>
            </div>
        </div>
    </div>
    <div id="copilotOverlay" class="copilot-overlay"></div>

    <!-- EDITOR UTAMA -->
    <main id="editorArea">
        <header class="glass-header">
            <h1 class="logo">GHOS<span class="glitch">~RD</span></h1>
            <div class="controls">
                <button id="langToggle" class="cyber-btn glass-btn">ID / EN</button>
                <button id="clearBtn" class="cyber-btn danger"><span data-id="Hapus" data-en="Clear">Hapus</span></button>
                <button id="saveBtn" class="cyber-btn info"><span data-id="Simpan" data-en="Save">Simpan</span></button>
                <button id="runBtn" class="cyber-btn run"><span data-id="Jalankan" data-en="Run Code">Jalankan</span></button>
                <button id="saveFileBtn" class="cyber-btn info">💾 File</button>
                <button id="copilotBtn" class="cyber-btn copilot"><span data-id="Co-pilot" data-en="Co-pilot">Co-pilot</span></button>
            </div>
        </header>

        <section class="editor-section glass-panel">
            <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('html')">HTML</button>
    <button class="tab-btn" onclick="switchTab('css')">CSS</button>
    <button class="tab-btn" onclick="switchTab('js')">JS</button>
    <button class="tab-btn" onclick="switchTab('files')">📁 FILES</button>
</div>
            
            <div class="code-containers">
                <div id="html-container" class="code-panel active">
                    <textarea id="htmlCode"></textarea>
                </div>
                <div id="css-container" class="code-panel">
                    <textarea id="cssCode"></textarea>
                </div>
                <div id="js-container" class="code-panel">
                    <textarea id="jsCode"></textarea>
                </div>
                <div id="files-container" class="code-panel">
    <div id="fileManagerUI" style="padding:12px;overflow-y:auto;height:100%;"></div>
</div>
            </div>
        </section>

        <footer>
            <p>development Vivi gioncyn</p>
        </footer>
    </main>

    <!-- OUTPUT SCREEN -->
    <div id="outputScreen" class="hidden">
        <div class="output-header glass-header">
            <span class="output-title" data-id="HASIL RENDER" data-en="OUTPUT RENDER">HASIL RENDER</span>
            <button id="backBtn" class="cyber-btn info"><span data-id="Kembali" data-en="Back">Kembali</span></button>
        </div>
        <div class="iframe-container">
            <iframe id="outputFrame"></iframe>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
   
<script src="script.js"></script>
<!-- MODAL BAHASA -->
<div id="langModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:3000;justify-content:center;align-items:center;">
    <div style="background:#0f0f14;border:1px solid rgba(0,240,255,0.3);border-radius:12px;padding:24px;width:280px;text-align:center;">
        <p style="color:#00f0ff;margin-bottom:16px;letter-spacing:2px;">PILIH BAHASA</p>
        <button onclick="setLang('id')" style="width:100%;margin-bottom:10px;padding:12px;background:rgba(0,240,255,0.1);color:#00f0ff;border:1px solid rgba(0,240,255,0.4);border-radius:8px;cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:1rem;">🇮🇩 Indonesia</button>
        <button onclick="setLang('en')" style="width:100%;padding:12px;background:rgba(180,0,255,0.1);color:#b400ff;border:1px solid rgba(180,0,255,0.4);border-radius:8px;cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:1rem;">🇬🇧 English</button>
        <button onclick="closeLangModal()" style="margin-top:12px;background:transparent;color:#888;border:none;cursor:pointer;font-family:'Share Tech Mono',monospace;">Batal</button>
    </div>
</div>

<!-- MODAL SIMPAN FILE -->
<div id="saveModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:3000;justify-content:center;align-items:center;">
    <div style="background:#0f0f14;border:1px solid rgba(0,240,255,0.3);border-radius:12px;padding:24px;width:300px;">
        <p style="color:#00f0ff;margin-bottom:16px;letter-spacing:2px;text-align:center;">💾 SIMPAN FILE</p>
        <input id="modalFolderName" placeholder="Nama folder proyek..." style="width:100%;background:rgba(0,0,0,0.5);color:#e0e0e0;border:1px solid rgba(0,240,255,0.3);border-radius:6px;padding:10px;font-family:'Share Tech Mono',monospace;font-size:0.9rem;margin-bottom:12px;">
        <p style="color:#888;font-size:0.8rem;margin-bottom:8px;">Pilih file yang akan disimpan:</p>
        <label style="color:#e0e0e0;display:block;margin-bottom:6px;"><input type="checkbox" id="saveHTML" checked> 🌐 HTML</label>
        <label style="color:#e0e0e0;display:block;margin-bottom:6px;"><input type="checkbox" id="saveCSS" checked> 🎨 CSS</label>
        <label style="color:#e0e0e0;display:block;margin-bottom:16px;"><input type="checkbox" id="saveJS" checked> ⚙️ JavaScript</label>
        <div style="display:flex;gap:8px;">
            <button onclick="confirmSaveFile()" style="flex:1;padding:10px;background:rgba(0,240,255,0.15);color:#00f0ff;border:1px solid rgba(0,240,255,0.4);border-radius:8px;cursor:pointer;font-family:'Share Tech Mono',monospace;">✅ Simpan</button>
            <button onclick="closeSaveModal()" style="padding:10px 16px;background:transparent;color:#888;border:1px solid rgba(255,255,255,0.1);border-radius:8px;cursor:pointer;font-family:'Share Tech Mono',monospace;">Batal</button>
        </div>
    </div>
</div>
    <!-- MODAL NOTIFIKASI -->
<div id="notifModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;justify-content:center;align-items:center;">
    <div style="background:#0f0f14;border:1px solid rgba(0,240,255,0.3);border-radius:12px;padding:24px;width:280px;text-align:center;">
        <p id="notifMessage" style="color:#e0e0e0;margin-bottom:16px;font-family:'Share Tech Mono',monospace;"></p>
        <button onclick="closeNotif()" style="padding:10px 24px;background:rgba(0,240,255,0.15);color:#00f0ff;border:1px solid rgba(0,240,255,0.4);border-radius:8px;cursor:pointer;font-family:'Share Tech Mono',monospace;">OK</button>
    </div>
</div>

<!-- MODAL KONFIRMASI -->
<div id="confirmModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;justify-content:center;align-items:center;">
    <div style="background:#0f0f14;border:1px solid rgba(255,0,60,0.3);border-radius:12px;padding:24px;width:280px;text-align:center;">
        <p id="confirmMessage" style="color:#e0e0e0;margin-bottom:16px;font-family:'Share Tech Mono',monospace;"></p>
        <div style="display:flex;gap:8px;justify-content:center;">
            <button id="confirmOkBtn" style="padding:10px 24px;background:rgba(255,0,60,0.15);color:#ff003c;border:1px solid rgba(255,0,60,0.4);border-radius:8px;cursor:pointer;font-family:'Share Tech Mono',monospace;">OK</button>
            <button onclick="closeConfirm()" style="padding:10px 16px;background:transparent;color:#888;border:1px solid rgba(255,255,255,0.1);border-radius:8px;cursor:pointer;font-family:'Share Tech Mono',monospace;">Batal</button>
        </div>
    </div>
</div>
</body>
</html>
